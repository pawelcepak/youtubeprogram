name: Android APK
on:
  push:
    branches: [main, android-v0.1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android source
        run: mkdir project && unzip -q android-source.zip -d project
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: QuizVideoStudio-Android-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
